version: 2
# Dependabot's update jobs reach only allowlisted hosts. Without this entry the
# llama-cu124 index in pyproject.toml answers 403 ("egress not allowlisted"),
# uv cannot re-lock, and every uv update (security ones too) fails.
registries:
  llama-cu124:
    type: python-index
    url: https://abetlen.github.io/llama-cpp-python/whl/cu124
updates:
  - package-ecosystem: "uv"
    directory: "/"
    registries: [llama-cu124]
    schedule: { interval: "weekly" }
    groups:
      # Majors stay out of the group so they arrive as their own PR and are
      # never swept into an auto-merge (see the automerge job in ci.yml).
      python: { patterns: ["*"], update-types: ["minor", "patch"] }
    # Pinned on purpose: the CUDA 12 libs match ctranslate2 and llama-cpp (12.9 has
    # no Windows wheel), and llama-cpp-python comes from the cu124 index, which
    # lags PyPI, so a PyPI-only version leaves the Windows split unresolvable.
    ignore:
      - dependency-name: "nvidia-cublas-cu12"
      - dependency-name: "nvidia-cuda-runtime-cu12"
      - dependency-name: "llama-cpp-python"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    groups:
      actions: { patterns: ["*"] }
