version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule: { interval: "weekly" }
    groups:
      # Majors stay out of the group so they arrive as their own PR and are
      # never swept into an auto-merge (see the automerge job in ci.yml).
      python: { patterns: ["*"], update-types: ["minor", "patch"] }
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    groups:
      actions: { patterns: ["*"] }
