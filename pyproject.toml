[project]
name = "whisper-dictate"
version = "0.1.0"
description = "A privacy-first, local speech-to-text and AI cleanup tool for Windows using faster-whisper and optional LLM cleanup"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ctranslate2>=4.8.2",
    "faster-whisper>=1.2.1",
    "keyring>=25.7.0",
    # Metaphone, for opt-in phonetic glossary rules.
    "jellyfish>=1.1.0",
    "numpy>=2.3.4",
    "nvidia-cublas-cu12==12.4.5.8",        # unchanged: CUDA pins are decided in Phase 3 with torch
    "nvidia-cuda-nvrtc-cu12==12.4.127",
    "nvidia-cuda-runtime-cu12==12.4.127",
    "nvidia-cudnn-cu12==9.5.0.50",
    "openai>=3.16",
    "pillow>=12.0.0",
    "sounddevice>=0.5.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pyinstaller>=6.22",
]
# Heavy ML wheels: installed locally, excluded in CI (`uv sync --no-group ml`).
# The tests mock these; this Windows machine exercises the real thing.
ml = [
    "torch",
    "transformers>=5.4.0",
    "huggingface-hub",
    # CohereAsrFeatureExtractor imports librosa at class load, whatever the audio
    # source. Not optional, despite audio.py already yielding 16 kHz float32.
    "librosa",
    "llama-cpp-python>=0.3.35",
]

[project.scripts]
dictate-gui = "whisper_dictate.gui:main"

[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true
default-groups = ["dev", "ml"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "llama-cu124"
url = "https://abetlen.github.io/llama-cpp-python/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
llama-cpp-python = [{ index = "llama-cu124", marker = "sys_platform == 'win32'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--cov=whisper_dictate",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Ruff >= 0.16 also formats Python blocks inside Markdown; docs and plans are prose.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # Line too long handled by formatter

[tool.ruff.lint.per-file-ignores]
# The clipboard fake mirrors Win32 entry points; their names are not ours to choose.
"tests/test_clipboard.py" = ["N802"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
